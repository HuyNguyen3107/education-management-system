spring.application.name=server

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/education_management_system
spring.datasource.username=postgres
spring.datasource.password=28122003

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==================================
# CẤU HÌNH GỬI EMAIL (DÙNG GMAIL)
# ==================================
# QUAN TRỌNG: Sử dụng biến môi trường để bảo mật
# Đặt biến môi trường trước khi chạy:
# Windows PowerShell:
#   $env:MAIL_USERNAME="your-email@gmail.com"
#   $env:MAIL_PASSWORD="your-16-digit-app-password"
# Linux/Mac:
#   export MAIL_USERNAME="your-email@gmail.com"
#   export MAIL_PASSWORD="your-16-digit-app-password"
#
# Cách lấy App Password:
# 1. Vào https://myaccount.google.com/security
# 2. Bật "2-Step Verification"
# 3. Vào "App passwords" → Tạo mật khẩu ứng dụng mới
# 4. Copy mật khẩu 16 ký tự
# ==================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:daominhnam2812@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password-here}

# Cấu hình thuộc tính JavaMail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000